name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run icons
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: node dist/cli.js render examples/order-platform.json -o order-platform.drawio
  vscode:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm --prefix vscode ci
      - run: npm run build:vscode
      - uses: actions/upload-artifact@v4
        with:
          name: drawman-vsix
          path: dist/drawman.vsix
