<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>draw.io live architecture</title>
  </head>
  <body>
    <div id="app">
      <header class="bar">
        <div class="brand">
          <svg viewBox="0 0 24 24" class="logo" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="4" fill="#f08705"/><rect x="5" y="5" width="6" height="5" rx="1" fill="#fff"/><rect x="13" y="14" width="6" height="5" rx="1" fill="#fff"/><path d="M8 10v4h8" stroke="#fff" stroke-width="1.6" fill="none"/></svg>
          <div class="titles">
            <div id="title" class="title">Architecture</div>
            <div id="subtitle" class="subtitle">draw.io · live</div>
          </div>
        </div>
        <div id="status" class="status waiting"><span class="dot"></span><span id="status-text">Waiting for the model…</span></div>
        <div class="actions">
          <button id="reset" title="Back to the automatic layout" hidden>Reset layout</button>
          <button id="flow" title="Animate data flow" disabled>Flow</button>
          <button id="fit" title="Fit to screen">Fit</button>
          <button id="open" title="Open in diagrams.net" disabled>Open in draw.io</button>
          <button id="download" class="primary" title="Download .drawio" disabled>Download .drawio</button>
          <button id="fullscreen" title="Fullscreen" class="icon">⤢</button>
        </div>
      </header>
      <main id="stage">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dadce0"/></pattern>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker>
            <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
            <marker id="m-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 z" fill="#ffffff" stroke="#5f6368" stroke-width="1.2"/></marker>
            <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#5f6368" stroke-width="1.3"/></marker>
            <marker id="m-dia" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="16" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#5f6368" stroke="#5f6368" stroke-width="1"/></marker>
            <marker id="m-odia" viewBox="0 0 16 10" refX="15" refY="5" markerWidth="16" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,5 L8,1 L15,5 L8,9 z" fill="#ffffff" stroke="#5f6368" stroke-width="1"/></marker>
            <marker id="m-one" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M3,1 V11 M7,1 V11" stroke="#5f6368" stroke-width="1.3" fill="none"/></marker>
            <marker id="m-many" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M11,1 L1,6 L11,11 M1,6 H11 M3,1 V11" stroke="#5f6368" stroke-width="1.3" fill="none"/></marker>
            <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#3c4043" flood-opacity="0.22"/></filter>
            <filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f08705" flood-opacity="0.9"/></filter>
          </defs>
          <rect id="bg" x="-5000" y="-5000" width="20000" height="20000" fill="url(#grid)"/>
          <g id="world">
            <g id="layer-title"></g>
            <g id="layer-frame"></g>
            <g id="layer-zones"></g>
            <g id="layer-seq"></g>
            <g id="layer-edges"></g>
            <g id="layer-cards"></g>
            <g id="layer-labels"></g>
            <g id="layer-flow"></g>
            <g id="layer-legend"></g>
          </g>
        </svg>
        <div id="empty" class="empty">
          <div class="pulse"></div>
          <div id="empty-text">Designing your diagram…</div>
        </div>
        <ol id="ticker" class="ticker"></ol>
        <div id="inspector" class="inspector" hidden></div>
        <div id="insights" class="insights" hidden></div>
        <div id="suggest" class="suggest" hidden></div>
      </main>
    </div>
    <script type="module" src="./view.ts"></script>
  </body>
</html>
